name: Build APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Unpack and Fix All Code
        run: |
          unzip -o CustomBoard*.zip
          sed -i 's/Theme.Material3.Dark.NoActionBar/Theme.AppCompat.NoActionBar/g' app/src/main/AndroidManifest.xml
          sed -i '/android:label=/d' app/src/main/res/xml/method.xml
          sed -i '50s/.*/        listOf("SHIFT", "~", ":", "\/", "?", "|", "<", ">", "DEL")/' app/src/main/java/com/customboard/ime/KeyboardLayoutView.kt
          sed -i 's/@SuppressLint("ClickableViewAccessibility")//g' app/src/main/java/com/customboard/ime/KeyboardLayoutView.kt
          sed -i 's/@Suppress("DEPRECATION")//g' app/src/main/java/com/customboard/ime/CustomBoardIME.kt

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CustomBoard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
